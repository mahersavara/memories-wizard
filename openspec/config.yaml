schema: cross-platform

# Project context
context: |
  The project context is defined in the AGENTS.md file

rules:
  proposal:
    - Keep platform-agnostic — no Win32 or SwiftUI specifics
    - Include a Capabilities section listing capabilities for both platforms
  specs-windows:
    - Reference Win32 APIs, WPF/XAML patterns where relevant
    - Use backslash path conventions in examples
  specs-macos:
    - Reference Cocoa/SwiftUI APIs where relevant
    - Follow Apple HIG conventions
  tasks-windows:
    - Reference MemoriesWizard.csproj and C# file paths under win/
  tasks-macos:
    - Reference Swift files under macOS/MemoriesWizard/
