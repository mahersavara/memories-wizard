name: proposal-only
version: 1
description: Shared platform-agnostic proposal — why and what only. Use this as the first change in any multi-platform feature.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Platform-agnostic proposal explaining the WHY and WHAT
    template: proposal.md
    instruction: >
      Create a PLATFORM-AGNOSTIC proposal explaining WHY this feature is needed
      and WHAT it does at a product level.

      DO NOT mention platform-specific APIs, frameworks, or implementation details
      (no Win32, no SwiftUI, no WPF, no AVFoundation). Specs, design, and tasks
      will be handled in separate platform-specific change folders:
        - <feature>-windows (schema: windows-impl)
        - <feature>-macos   (schema: macos-impl)

      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes
          a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: List existing capabilities whose requirements
          are changing. Check `openspec/specs/` for existing spec names.
      - **Impact**: Affected code, APIs, dependencies (platform-agnostic terms).
      - **Non-goals**: What is explicitly out of scope for this change?

      IMPORTANT: The Capabilities section is critical. It creates the contract
      between the proposal and the platform-specific specs phases. Each capability
      listed here will need a corresponding spec file in the platform change folders.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in the platform-specific design.md files.

      This proposal is the foundation both platform changes will read for context.
    requires: []

apply:
  requires:
    - proposal
  tracks: proposal.md
  instruction: |
    This is a planning-only change. There is nothing to implement here.
    The proposal.md is the deliverable. Platform-specific implementation
    is handled in sibling change folders using the windows-impl or macos-impl schemas.
