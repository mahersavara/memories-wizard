name: windows-impl
version: 1
description: Windows platform implementation — specs, design, tasks only. Reads the shared proposal from a sibling proposal change.
artifacts:
  - id: specs
    generates: specs/**/*.md
    description: Windows-specific specifications
    template: spec.md
    instruction: >
      Before writing specs, read the shared proposal from the sibling change folder:
        openspec/changes/<base-name>-proposal/proposal.md
      (Replace <base-name> with this feature's name, e.g. install-flow-proposal/proposal.md)

      Use the proposal for the WHY and WHAT. Then write Windows-specific requirements covering:
      - Win32 / WinRT APIs involved
      - Installer format (.exe / .msi / MSIX)
      - File system paths (%APPDATA%, backslash conventions, etc.)
      - Windows Registry keys if applicable
      - Windows-specific UI behaviors (WPF, WinUI, XAML)
      - Error handling and edge cases on Windows

      Create one spec file per capability listed in the proposal's Capabilities section.
      Use the same kebab-case capability names from the proposal.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      Specs should be testable - each scenario is a potential test case.
    requires: []
  - id: design
    generates: design.md
    description: Windows-specific implementation design
    template: design.md
    instruction: >
      Before writing the design, read:
        openspec/changes/<base-name>-proposal/proposal.md
      and the specs already created in this change folder.

      Design the Windows-specific implementation approach covering:
      - Architecture and component structure (WPF / WinUI / XAML)
      - Data flow and state management
      - Key classes, services, and interfaces
      - Integration with existing win/ code
      - New dependencies or NuGet packages required
      - Testing approach for Windows

      Sections:
      - **Context**: Background, current state, constraints
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered.
      - **Risks / Trade-offs**: Known limitations. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.
    requires: []
  - id: tasks
    generates: tasks.md
    description: Windows implementation task list
    template: tasks.md
    instruction: >
      Read the shared proposal at openspec/changes/<base-name>-proposal/proposal.md,
      plus the specs and design in this change folder.

      Create a concrete, ordered implementation task list for the Windows (C#/WPF) build.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session (max 2 hours)
      - Order tasks by dependency (what must be done first?)
      - Reference file paths relative to the win/ directory
      - Mark tasks that require Windows-specific testing explicitly

      Example:
      ```
      ## 1. Setup
      - [ ] 1.1 Create new service class in win/Services/
      - [ ] 1.2 Add NuGet package reference to win/MemoriesWizard.csproj

      ## 2. Core Implementation
      - [ ] 2.1 Implement core logic in win/
      - [ ] 2.2 Wire up UI in MainWindow.xaml
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Before implementing, read the shared proposal for full feature context:
      openspec/changes/<base-name>-proposal/proposal.md
    Then read this change's specs, design, and tasks.
    Implement only the Windows-specific tasks listed in tasks.md.
    All code changes should go into the win/ directory.
